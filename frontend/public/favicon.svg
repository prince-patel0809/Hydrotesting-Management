<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
  </defs>
  <!-- Rounded Shield / Base -->
  <rect width="64" height="64" rx="14" fill="url(#blueGrad)" />
  
  <!-- Outer Pressure Dial Ring -->
  <circle cx="32" cy="32" r="22" stroke="#60a5fa" stroke-width="3.5" fill="none" opacity="0.3" />
  <path d="M 16 38 A 19 19 0 1 1 48 38" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" fill="none" />
  
  <!-- Center Gauge Dial Hub -->
  <circle cx="32" cy="36" r="4.5" fill="#38bdf8" />
  
  <!-- Gauge Needle pointing upward right (optimal pressure) -->
  <line x1="32" y1="36" x2="42" y2="22" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />
  <circle cx="32" cy="36" r="2" fill="#ffffff" />
  
  <!-- Top Pulse / Drop Indicator -->
  <path d="M32 10 C30 14, 28 17, 28 19 A4 4 0 0 0 36 19 C36 17, 34 14, 32 10 Z" fill="#38bdf8" />
</svg>